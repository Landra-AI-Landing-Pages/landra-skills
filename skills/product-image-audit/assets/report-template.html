<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* Product Image Audit, visual report. Self-contained: no external fonts, images or scripts.
   Rung colours are categorical slots 2/1/3 of the dataviz reference palette (validated all-pairs,
   light + dark). Status colours are the reserved good/warning/critical set and always ship with an
   icon + label. */
.r, .r * { box-sizing: border-box; }
.r {
  color-scheme: light;
  --bg: #f3f1ec; --card: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #7a7974; --line: #e4e2dc;
  --feature: #eb6834; --benefit: #2a78d6; --end: #1baf7a; --none: #a3a29c;
  --good: #0ca30c; --warn: #fab219; --bad: #d03b3b;
  --accent: #6250d6; --accent2: #e87ba4;
  margin: 0; padding: 16px 12px 40px; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
@media (prefers-color-scheme: dark) {
  .r { color-scheme: dark;
    --bg: #111110; --card: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #8f8e88; --line: #2e2e2c;
    --feature: #d95926; --benefit: #3987e5; --end: #199e70; --none: #6b6a66; --accent: #9085e9; --accent2: #d55181; }
}
.wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; min-width: 0; }
h1 { font-size: 24px; line-height: 1.2; margin: 2px 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 18px; margin: 0 0 4px; }
h3 { font-size: 15px; margin: 0 0 6px; }
p { margin: 0 0 6px; }
.sub, .meta { color: var(--ink2); font-size: 13px; }
.muted { color: var(--muted); font-weight: 400; font-size: 13px; }
q { quotes: "\201C" "\201D"; }
img { display: block; max-width: 100%; }

/* header */
.hero { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--card)), var(--card) 55%, color-mix(in srgb, var(--end) 12%, var(--card))); }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; font-weight: 700; color: var(--accent); margin: 0; }
.hero-top { display: flex; gap: 16px; align-items: center; justify-content: space-between; }
.ring { width: 118px; height: 118px; flex: none; }
.ring circle { fill: none; stroke-width: 12; }
.ring-bg { stroke: var(--line); }
.ring-have { stroke: var(--end); stroke-linecap: round; }
.ring-part { stroke: var(--warn); }
.ring-num { font-size: 34px; font-weight: 800; text-anchor: middle; fill: var(--ink); }
.ring-of { font-size: 18px; fill: var(--ink2); font-weight: 600; }
.ring-lbl { font-size: 11px; text-anchor: middle; fill: var(--ink2); text-transform: uppercase; letter-spacing: .06em; }
.note { background: color-mix(in srgb, var(--warn) 16%, var(--card)); border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-top: 10px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 12px; }
.facts div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.facts dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); font-weight: 700; }
.facts dd { margin: 3px 0 0; font-size: 14px; }
.gap { display: flex; gap: 12px; align-items: flex-start; background: color-mix(in srgb, var(--bad) 10%, var(--card)); border-left: 4px solid var(--bad); border-radius: 10px; padding: 10px 12px; }
.gap-k { flex: none; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--bad); padding-top: 3px; }
.gap p { margin: 0; font-weight: 600; }

/* tiles + thumbs */
.tile { aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden; background: #fff; border: 1px solid var(--line); }
.tile.im { background-color: #fff; background-position: center; background-size: cover; background-repeat: no-repeat; }
.tile.ph { display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: #fff; }
.tile.c0 { background: #6250d6; } .tile.c1 { background: #c2557f; } .tile.c2 { background: #52514e; }
.tile.c3 { background: #8a6d00; } .tile.c4 { background: #3d6b8f; } .tile.c5 { background: #7a4a9e; }
.tile.nw { background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--accent) 10%, var(--card)) 0 8px, var(--card) 8px 16px); border: 2px dashed var(--accent); color: var(--accent); font-size: 15px; }
.num { position: absolute; top: 6px; left: 6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: rgba(11,11,11,.78); color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

/* pills + status */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 99px; white-space: nowrap; color: var(--ink); vertical-align: middle; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.r-feature { background: color-mix(in srgb, var(--feature) 18%, var(--card)); } .pill.r-feature::before { background: var(--feature); }
.pill.r-benefit { background: color-mix(in srgb, var(--benefit) 18%, var(--card)); } .pill.r-benefit::before { background: var(--benefit); }
.pill.r-end { background: color-mix(in srgb, var(--end) 20%, var(--card)); } .pill.r-end::before { background: var(--end); }
.pill.r-none { background: color-mix(in srgb, var(--none) 22%, var(--card)); } .pill.r-none::before { background: var(--none); }
.st { max-width: 100%; overflow: hidden; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px 2px 3px; border-radius: 99px; white-space: nowrap; }
.st b { width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; }
.st.good { background: color-mix(in srgb, var(--good) 14%, var(--card)); } .st.good b { background: var(--good); }
.st.warn { background: color-mix(in srgb, var(--warn) 22%, var(--card)); } .st.warn b { background: #b47c00; }
.st.bad { background: color-mix(in srgb, var(--bad) 14%, var(--card)); } .st.bad b { background: var(--bad); }

/* gallery strip */
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; padding: 10px 0 12px; }
.g { margin: 0; min-width: 0; scroll-snap-align: start; }
.g-img { position: relative; }
.g figcaption { padding-top: 7px; display: grid; gap: 5px; justify-items: start; }
.g .job { font-size: 13px; line-height: 1.3; margin: 0; }

/* rung chart */
.chart { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.chart-title { font-weight: 700; margin-bottom: 8px; }
.bar-row { display: grid; grid-template-columns: 150px 1fr 28px; align-items: center; gap: 10px; padding: 4px 0; }
.bar-row:hover .bar { filter: brightness(1.08); }
.bar-lbl { font-size: 13px; color: var(--ink2); }
.bar-track { height: 18px; background: color-mix(in srgb, var(--line) 55%, transparent); border-radius: 4px; overflow: hidden; }
.bar { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 0; }
.bar.r-feature { background: var(--feature); } .bar.r-benefit { background: var(--benefit); } .bar.r-end { background: var(--end); } .bar.r-none { background: var(--none); }
.bar-val { font-weight: 800; font-variant-numeric: tabular-nums; }

/* rows */
.row { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-of-type { border-bottom: 0; }
.row-img, .rw-img { position: relative; }
.row-head { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 4px; }
.copy { font-style: italic; }
.copy .pill { font-style: normal; }

/* callouts */
.callout { border-radius: 14px; padding: 12px 14px; border: 1px solid var(--line); }
.callout ul { margin: 0; padding-left: 18px; } .callout li { margin: 3px 0; }
.callout.good { background: color-mix(in srgb, var(--good) 9%, var(--card)); border-color: color-mix(in srgb, var(--good) 35%, var(--line)); margin-top: 12px; }
.callout.best { background: color-mix(in srgb, var(--end) 12%, var(--card)); border-color: color-mix(in srgb, var(--end) 40%, var(--line)); margin-top: 10px; }
.callout.fix { background: color-mix(in srgb, var(--bad) 7%, var(--card)); border-color: color-mix(in srgb, var(--bad) 30%, var(--line)); }
.callout.chk { background: color-mix(in srgb, var(--warn) 10%, var(--card)); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.duo .callout { background-color: var(--card); }
.duo .callout.fix { background: color-mix(in srgb, var(--bad) 7%, var(--card)); }
.duo .callout.chk { background: color-mix(in srgb, var(--warn) 10%, var(--card)); }

/* rewrites */
.rw { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.tag { display: inline-block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; margin-right: 4px; vertical-align: 1px; }
.before { color: var(--ink2); }
.before .tag { background: var(--line); color: var(--ink2); }
.after { font-size: 17px; font-weight: 700; line-height: 1.35; }
.after .tag { background: var(--end); color: #fff; }
.why { font-size: 13px; color: var(--ink2); }

/* checklist */
.ck-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 8px; }
.ck-col ul { list-style: none; margin: 0; padding: 0; }
.ck { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; font-size: 14px; }
.ck b { flex: none; width: 20px; height: 20px; border-radius: 50%; color: #fff; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; }
.ck.good b { background: var(--good); } .ck.warn b { background: #b47c00; } .ck.bad b { background: var(--bad); }
.ck em { color: var(--muted); font-style: normal; font-size: 12px; }

/* briefs */
.briefs { display: grid; gap: 12px; margin-top: 10px; }
.brief { display: grid; grid-template-columns: 150px 1fr; gap: 14px; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.brief-tile { aspect-ratio: 1 / 1; border-radius: 10px; border: 2px dashed var(--accent); background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--accent) 9%, var(--card)) 0 8px, var(--card) 8px 16px); display: flex; flex-direction: column; justify-content: space-between; padding: 10px; position: relative; }
.new { align-self: flex-start; background: var(--accent); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 2px 8px; border-radius: 6px; }
.pos { position: absolute; top: 10px; right: 10px; font-weight: 800; color: var(--accent); }
.brief-shot { font-size: 13px; font-weight: 700; line-height: 1.3; }
.brief dl { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; margin: 8px 0 0; font-size: 14px; }
.brief dt { color: var(--ink2); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
.brief dd { margin: 0; }
.prio { font-size: 11px; font-weight: 800; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; vertical-align: 2px; margin-left: 4px; }
.prio.must { background: color-mix(in srgb, var(--bad) 15%, var(--card)); color: var(--ink); }
.prio.should { background: color-mix(in srgb, var(--benefit) 15%, var(--card)); color: var(--ink); }
.have-it { margin-top: 8px; font-size: 13px; background: color-mix(in srgb, var(--end) 12%, var(--card)); padding: 6px 9px; border-radius: 8px; }

/* order */
.order { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin: 10px 0 6px; }
.o { position: relative; }
.o p { font-size: 12px; line-height: 1.3; margin: 6px 0 0; }
.o.cut .tile { opacity: .35; filter: grayscale(1); }
.o.cut .num { background: var(--bad); }
.o.o-new .num { background: var(--accent); }

@media (max-width: 640px) {
  .r { padding: 10px 8px 30px; font-size: 14px; }
  .card { padding: 14px; border-radius: 14px; }
  h1 { font-size: 20px; }
  .ring { width: 92px; height: 92px; }
  .facts, .duo { grid-template-columns: 1fr; }
  .strip { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding: 10px 0 12px; }
  .gap { flex-direction: column; gap: 4px; }
  .g { flex: 0 0 132px; }
  .row, .rw { grid-template-columns: 72px 1fr; gap: 10px; }
  .brief { grid-template-columns: 1fr; }
  .brief-tile { aspect-ratio: auto; min-height: 92px; }
  .brief dl { grid-template-columns: 1fr; }
  .bar-row { grid-template-columns: 112px 1fr 24px; }
  .order { grid-template-columns: repeat(3, 1fr); }
  .after { font-size: 16px; }
}
</style>
<style>/*THUMBS*/</style>
</head>
<body class="r">
<main class="wrap">
<!--BODY-->
<p class="sub" style="text-align:center">Product Image Audit</p>
</main>
</body>
</html>
